# Filtro fail2ban para SchoolBar
# Captura intentos de login fallidos escritos por services/authLogger.js
# Formato de línea:
#   2026-06-13T10:15:00.000Z [AUTH-FAIL] ip=1.2.3.4 email=foo@bar.com event=LOGIN_FAILED

[Definition]
failregex = ^.*\[AUTH-FAIL\] ip=<HOST> .*$
ignoreregex =

# datepattern: el timestamp es ISO-8601 al inicio de la línea.
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S
