# Jail fail2ban para SchoolBar
# Se coloca en /etc/fail2ban/jail.d/ para no tocar el jail.local existente.
#
# Regla pedida por el cliente:
#   - 5 intentos fallidos en 10 minutos desde una IP  -> ban 2 horas
#   - Reincidencia (que la misma IP vuelva a ser baneada dentro de 2 dias)
#     -> ban permanente. Esto lo cubre el jail [recidive] ya existente en
#     jail.local; para que sea exacto a 2 dias, ajustar alli: findtime = 2d

[schoolbar]
enabled  = true
filter   = schoolbar
logpath  = /root/schoolbar/logs/auth.log
maxretry = 5
findtime = 10m
bantime  = 2h
# La app no escucha en un puerto publico; el trafico entra por NPM (80/443).
# Baneamos a nivel de host con iptables sobre los puertos web.
port     = http,https
action   = iptables-multiport[name=schoolbar, port="http,https", protocol=tcp]
